<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>الأمين للتوصيل | تطبيق الشحن والتوصيل</title>
  <meta name="description" content="تطبيق الأمين للتوصيل - نوصل طلبك بأمان وسرعة داخل العراق وخارجه" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />

  <!-- PWA: manifest + theme -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#F15A29" />

  <!-- PWA: دعم أندرويد (Add to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA: دعم آيفون (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="الأمين للتوصيل" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Fonts: Cairo for display/headings, Tajawal for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (utility layer, design tokens layered on top via style.css) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Cairo', 'sans-serif'],
            body: ['Tajawal', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="font-body">
  <div id="app"></div>

  <!-- App scripts (order matters: data -> api -> components -> pages -> router -> app) -->
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="pages.js"></script>
  <script src="router.js"></script>
  <script src="app.js"></script>

  <!-- تسجيل Service Worker لدعم العمل بدون اتصال وإضافة التطبيق للشاشة الرئيسية -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
